services:
  zookeeper:
    image: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
  
  kafka:
    depends_on:
      - zookeeper
    image: bitnami/kafka
    environment:
      KAFKA_ADVERTISED_HOST_NAME: 0.0.0.0
      ALLOW_PLAINTEXT_LISTENER: "yes"
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
  
  barista:
    depends_on:
      - kafka
    build:
      context: ./
      dockerfile: ./barista/Dockerfile
    ports:
      - "8003:8080"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092


  beans:
    depends_on:
      - barista
    build:
      context: ./
      dockerfile: ./beans/Dockerfile
    ports:
      - "8002:8080"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092

  orders:
    depends_on:
      - beans
    build:
      context: ./
      dockerfile: ./orders/Dockerfile
    ports:
      - "8001:8080"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
